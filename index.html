<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>P3 / P4 / P5 / P6 上机仿真评测</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8 21 8v8l-9 5.2L3 16V8z"/><path d="m3 8 9 5 9-5M12 13v8.2"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m10.5 13-2 2 2 2M13.5 13l2 2-2 2"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 3v18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-3 7.5-3 9h18c0-1.5-3-2.5-3-9"/><path d="M10 21h4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-3.7 3.7-5.5 7.5-5.5s6.9 1.8 7.5 5.5"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m20.5 11.5-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.8 1.8 0 0 1-2.5-2.5l7.7-7.7"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M6.5 18.5a4.5 4.5 0 0 1-.6-8.96A7 7 0 0 1 19.3 9.8a4.2 4.2 0 0 1 .7 8.3"/><path d="M12 20.5V12M8.5 15.2 12 11.7l3.5 3.5"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 14.5-6-6-6 6"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="m7.2 12.4 3.1 3.1 6.4-6.4" fill="none" stroke="#fff" stroke-width="2.1"/></symbol>
  <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 6.8v6.4M12 17.1h.01" fill="none" stroke="#fff" stroke-width="2.1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.8"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 21h16"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2.8 9 4.7-9 4.7-9-4.7z"/><path d="m3 12 9 4.7 9-4.7M3 16.6l9 4.7 9-4.7"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" opacity=".25"/><path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 13V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7"/></symbol>
</svg>

<div class="app">
  <nav class="rail" aria-label="页面导航">
    <button class="rail-btn is-active" type="button" data-action="bank" title="题库"><svg class="icon"><use href="#i-list"/></svg></button>
    <button class="rail-btn" type="button" data-action="help" data-topic="env" title="评测环境"><svg class="icon"><use href="#i-cube"/></svg></button>
    <button class="rail-btn" type="button" data-action="records" title="提交记录"><svg class="icon"><use href="#i-terminal"/></svg></button>
    <button class="rail-btn" type="button" data-action="files" title="选择源码文件"><svg class="icon"><use href="#i-file"/></svg></button>
    <button class="rail-btn" type="button" data-action="help" data-topic="data" title="测试数据与日志"><svg class="icon"><use href="#i-db"/></svg></button>
    <button class="rail-btn" type="button" data-action="history" title="提交统计"><svg class="icon"><use href="#i-chart"/></svg></button>
    <button class="rail-btn" type="button" data-action="help" data-topic="guide" title="使用说明"><svg class="icon"><use href="#i-book"/></svg></button>
  </nav>

  <header class="topbar">
    <button class="topbar-title" type="button" id="bankTitle" title="打开题库" aria-haspopup="dialog">题目<span class="title-chevron"><svg class="icon"><use href="#i-chevron-down"/></svg></span></button>
    <div class="topbar-actions">
      <div class="clock"><svg class="icon"><use href="#i-clock"/></svg><span id="clock">--:--:--</span></div>
      <button class="icon-btn bell" type="button" id="bell" title="评测通知" aria-label="评测通知">
        <svg class="icon"><use href="#i-bell"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
      <span class="avatar" title="本地练习用户" aria-hidden="true"><svg class="icon"><use href="#i-user"/></svg></span>
    </div>
  </header>

  <div class="page">
    <main class="columns">
      <section class="problem" aria-labelledby="problemTitle">
        <div class="problem-head">
          <h1 class="problem-title" id="problemTitle"><span class="qid" id="problemId">—</span><span id="problemName">加载中</span></h1>
          <span class="tag">文件上传</span>
          <span class="problem-meta" id="problemMeta">题目编号 —</span>
        </div>
        <table class="stmt" id="statement"><tbody><tr><th scope="row">题面</th><td class="stmt-loading">正在读取题目…</td></tr></tbody></table>
        <div class="problem-foot">
          <button class="doc-link" type="button" data-action="help" data-topic="guide"><svg class="icon"><use href="#i-book"/></svg>P3 / P4 / P5 / P6 本地评测 · 判题规则</button>
          <span class="source" id="source"></span>
        </div>
      </section>

      <aside class="side">
        <section class="card submit-card" id="submitCard" aria-labelledby="submitCardTitle">
          <div class="card-head">
            <h2 id="submitCardTitle">提交 <span class="card-title-tail" id="submitTitle">—</span></h2>
          </div>
          <div class="card-body">
            <div class="field">
              <label class="field-label" for="encoding">选择编码</label>
              <div class="select-row">
                <svg class="icon select-icon"><use href="#i-cube"/></svg>
                <div class="select-wrap">
                  <select id="encoding" aria-label="选择编码"></select>
                  <svg class="icon chevron"><use href="#i-chevron-down"/></svg>
                </div>
              </div>
              <p class="field-note" id="encodingNote"></p>
            </div>

            <div class="upload-row">
              <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="点击或拖拽选择源码文件">
                <svg class="icon clip"><use href="#i-paperclip"/></svg>
                <span class="drop-text" id="dropText">点击/拖拽选择文件</span>
              </div>
              <input type="file" id="files" multiple accept=".zip,.v,.vh,.circ" hidden>
              <button class="submit-btn" id="submit" type="button" disabled>
                <svg class="icon"><use href="#i-upload"/></svg><span>提交</span>
              </button>
            </div>
            <ul class="file-list" id="fileList"></ul>
            <p class="form-hint"><span id="uploadHint">ZIP 或全部 .v / .vh，20 MB 以内</span><span class="dot">·</span><button class="text-link" type="button" id="togglePath">填写本机源码目录</button></p>
            <div class="path-row" id="pathRow" hidden>
              <input id="sourcePath" type="text" spellcheck="false" placeholder="例如 C:\Users\Public\Documents\ISE_projects\Q11">
            </div>

            <p class="form-msg" id="message" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="card records" id="recordsCard" aria-labelledby="recordsTitle">
          <div class="card-head">
            <h2 id="recordsTitle">提交记录</h2>
            <button class="link" type="button" id="historyLink">查看提交历史</button>
          </div>
          <div class="card-body">
            <div class="empty" id="emptyState">
              <svg class="icon empty-icon"><use href="#i-inbox"/></svg>
              <p class="empty-title">尚未提交</p>
              <p>选择源码后点击提交，测试点结果会实时显示在这里。</p>
            </div>

            <div id="record" hidden>
              <dl class="meta">
                <div><dt>ID</dt><dd class="mono" id="jobId">—</dd></div>
                <div><dt>提交时间</dt><dd id="jobTime">—</dd></div>
                <div class="verdict-row">
                  <dt>评测结果</dt>
                  <dd class="verdict">
                    <span class="verdict-icon" id="verdictIcon"></span>
                    <span class="verdict-text" id="verdictText"></span>
                    <button class="icon-btn small" type="button" id="toggleCases" aria-label="收起测试点结果" title="收起测试点结果"><svg class="icon"><use href="#i-chevron-up"/></svg></button>
                  </dd>
                </div>
              </dl>
              <div class="progress" id="progress" hidden><div class="bar" id="bar"></div></div>
              <p class="summary" id="summary"></p>
              <ul class="cases" id="cases"></ul>
              <div class="record-foot">
                <button class="link with-icon" type="button" id="download" hidden><svg class="icon"><use href="#i-download"/></svg>下载本次结果 JSON</button>
                <span class="record-path" id="recordPath"></span>
              </div>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="题库">
  <div class="drawer-head">
    <h2>题库</h2>
    <button class="icon-btn small" type="button" id="drawerClose" aria-label="关闭题库"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <label class="search-box">
    <svg class="icon"><use href="#i-search"/></svg>
    <input id="search" type="search" placeholder="搜索题号、指令或描述" autocomplete="off">
  </label>
  <div class="drawer-body" id="problemList"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">—</h2>
      <button class="icon-btn small" type="button" id="modalClose" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/assets/app.js"></script>
</body>
</html>
